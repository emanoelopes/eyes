<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor Google Meet</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Monitor Google Meet</h1>
        <p id="updated">Carregando...</p>
      </div>
      <div class="controls">
        <input id="search" placeholder="Filtrar sala..." autocomplete="off">
        <label class="toggle">
          <input type="checkbox" id="hoje" checked>
          Somente salas de hoje
        </label>
        <button id="btn-relatorio" class="report-btn" type="button">
          📋 Gerar relatório (texto)
        </button>
        <a id="btn-relatorio-html" class="report-btn report-btn-link" href="/api/report.html" target="_blank" rel="noopener noreferrer">
          📊 Relatório visual (HTML)
        </a>
        <button id="btn-salvar-relatorio" class="report-btn" type="button">
          💾 Salvar relatório do encontro
        </button>
      </div>
    </header>
    <div id="report-box" class="report-box hidden">
      <div class="report-box-head">
        <strong>Relatório para o coordenador</strong>
        <div>
          <button id="btn-copiar-relatorio" type="button">Copiar</button>
          <button id="btn-fechar-relatorio" type="button">Fechar</button>
        </div>
      </div>
      <textarea id="report-text" readonly></textarea>
    </div>
    <section class="summary">
      <div><strong id="active_rooms">0</strong><span>salas ativas</span></div>
      <div><strong id="active_cells">0</strong><span>células ativas</span></div>
      <div><strong id="participants">0</strong><span>participantes</span></div>
      <div><strong id="recording">0</strong><span>gravando</span></div>
      <div><strong id="total">0</strong><span>salas / grupos</span></div>
    </section>
    <section id="rooms" class="rooms"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
